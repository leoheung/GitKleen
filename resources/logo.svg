<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- GitKleen: a check mark drawn as a commit graph, the changes checked and clean. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2E5C"/>
      <stop offset="1" stop-color="#0A1226"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#5FE3C0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5FE3C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="check" gradientUnits="userSpaceOnUse" x1="320" y1="680" x2="720" y2="360">
      <stop offset="0" stop-color="#2FD9A8"/>
      <stop offset="1" stop-color="#7FB2FF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- The body, on the macOS icon grid: 824 square, 100 from the edges. -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- The check: a short stroke down to the corner, a long one up to the right,
       drawn like a branch of commits, rounded as the graph lines are. -->
  <path d="M318 548 L452 682 L718 374" fill="none" stroke="url(#check)"
        stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Commits: rings at the two ends of the branch, the corner solid. -->
  <circle cx="318" cy="548" r="52" fill="#101C36" stroke="#2FD9A8" stroke-width="24"/>
  <circle cx="718" cy="374" r="52" fill="#101C36" stroke="#8DBBFF" stroke-width="24"/>
  <circle cx="452" cy="682" r="46" fill="#FFFFFF"/>
</svg>
